name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: "**/pnpm-lock.yaml" }
      - run: node --check core/server.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C web install --frozen-lockfile
      - name: Web build (strict TypeScript)
        run: pnpm -C web build
      - name: Core and TUI tests (node:test)
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml "test/*.test.mjs"
      - name: Web tests (Vitest)
        run: pnpm -C web test -- --reporter=default --reporter=junit --outputFile=test-results/web.xml
      - name: Browser smoke (Playwright)
        run: pnpm -C web exec playwright install --with-deps chromium && pnpm -C web test:e2e
      - uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: "test-results.xml,web/test-results/*.xml"
          check_name: Test results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore
